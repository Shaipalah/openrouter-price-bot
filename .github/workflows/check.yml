name: OpenRouter Price Check

on:
  schedule:
    - cron: '0 * * * *' # Запускать каждый час (в 0 минут)
  workflow_dispatch: # Позволяет запустить вручную кнопкой

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Нужно, чтобы сохранить новую цену в файл
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run price check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Commit price state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update price state"
          git push
